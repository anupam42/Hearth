<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ears -->
  <circle cx="32" cy="56" r="23" fill="#5f96aa" stroke="#2c2419" stroke-width="8"/>
  <circle cx="168" cy="56" r="23" fill="#5f96aa" stroke="#2c2419" stroke-width="8"/>

  <!-- head -->
  <circle cx="100" cy="108" r="68" fill="#f1e5d7" stroke="#2c2419" stroke-width="10"/>

  <!-- hood -->
  <path d="M 37,82 A 68,68 0 0 1 163,82 Q 100,98 37,82 Z" fill="#29738e" stroke="#2c2419" stroke-width="10" stroke-linejoin="round"/>
  <ellipse cx="76" cy="58" rx="22" ry="10" fill="#ffffff" opacity="0.18" transform="rotate(-20 76 58)"/>

  <!-- blush -->
  <ellipse cx="60" cy="144" rx="10" ry="6" fill="#7f6f62" opacity="0.25"/>
  <ellipse cx="140" cy="144" rx="10" ry="6" fill="#7f6f62" opacity="0.25"/>

  <!-- closed happy eyes -->
  <path d="M 66,130 Q 79,116 92,130" fill="none" stroke="#2c2419" stroke-width="9" stroke-linecap="round"/>
  <path d="M 108,130 Q 121,116 134,130" fill="none" stroke="#2c2419" stroke-width="9" stroke-linecap="round"/>

  <!-- content smile -->
  <path d="M 82,152 Q 100,166 118,152" fill="none" stroke="#2c2419" stroke-width="9" stroke-linecap="round"/>
</svg>
